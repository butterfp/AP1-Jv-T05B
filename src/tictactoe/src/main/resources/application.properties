spring.datasource.url=jdbc:postgresql://localhost:5433/tictactoe

spring.datasource.username=tictactoe_user
spring.datasource.password=password

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# Base64 HMAC secret (at least 32 bytes). If absent, tokens expire on application restart.
jwt.secret=${JWT_SECRET:}
jwt.access-seconds=900
jwt.refresh-seconds=2592000
